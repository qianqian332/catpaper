<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>模板标题</title>
<!--
========================================================================
  复古报刊编辑部 · 图文指南模板 v1.0
  用法：改文字、加步骤、换颜色，不需要懂代码
  颜色在一处改（下面 :root），整站换肤
========================================================================
-->
<style>
  /* ============================================================
     1. 主题颜色 — 只改这里，整个页面颜色全变
     ============================================================ */
  :root {
    --paper: #f1e9d4;       /* 页面底色（旧报纸米白） */
    --card: #fbf5e4;        /* 卡片底色（奶油纸） */
    --ink: #5c3a21;         /* 主文字色（浅棕墨） */
    --ink-2: #8a6d3b;       /* 次要文字色 */
    --accent: #d47826;      /* 强调色（橘黄） */
    --green: #4a6b3a;       /* 次强调色（墨绿） */
    --border: #dccca4;      /* 常规边框 */
    --border-d: #c9b585;    /* 强边框 */
    --danger: #a83838;      /* 警告色（红色邮票） */
  }

  /* ============================================================
     2. 基础布局 — 一般不用改
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Georgia", "Noto Serif SC", "Songti SC", serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.8;
    padding: 24px 16px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* ============================================================
     3. 页头 — 报刊报头风格
     ============================================================ */
  .header {
    text-align: center;
    border-bottom: 3px double var(--border-d);  /* 双线分隔，报纸报头感 */
    padding-bottom: 20px;
    margin-bottom: 28px;
  }
  .header .kicker {
    font-size: 11px; letter-spacing: .2em;
    color: var(--ink-2); font-style: italic;
    text-transform: uppercase;  /* 全大写英文小标签 */
  }
  .header h1 { font-size: 26px; margin-top: 6px; color: var(--ink); }
  .header .sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

  /* ============================================================
     4. 设备标签 — 小药丸，标记"电脑/手机"
     ============================================================ */
  .device-badge {
    display: inline-block;
    font-size: 11px; font-weight: 800;
    padding: 3px 10px; border-radius: 20px;
    letter-spacing: .08em; margin-bottom: 6px;
  }
  .device-badge.pc    { background: var(--accent); color: #fff; }
  .device-badge.phone { background: var(--green);  color: #fff; }
  /* 想加新标签？复制一行改名字和颜色即可：
     .device-badge.other { background: var(--danger); color: #fff; } */

  /* ============================================================
     5. 步骤卡片 — 每一步一个卡片，带"胶带"装饰
     ============================================================ */
  .step {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
    position: relative;
  }
  /* 卡片顶部的"胶带"装饰 — 复古手账感 */
  .step::before {
    content: ""; position: absolute;
    top: -6px; left: 20px;
    width: 36px; height: 18px;
    background: rgba(212,120,38,.3);
    border: 1px dashed rgba(212,120,38,.4);
    transform: rotate(-2deg);
  }
  .step-num { font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: .1em; }
  .step h3 { font-size: 16px; margin: 6px 0 10px; color: var(--ink); }
  .step p { font-size: 14px; color: var(--ink); margin-bottom: 8px; }
  .step ol { margin-left: 20px; font-size: 14px; }
  .step ol li { margin-bottom: 6px; }

  /* 提示框（绿色左边框） */
  .tip {
    background: rgba(74,107,58,.1);
    border-left: 3px solid var(--green);
    padding: 8px 12px; font-size: 13px;
    border-radius: 0 8px 8px 0; margin-top: 10px;
    color: var(--ink);
  }
  /* 警告框（橙色左边框） */
  .warn {
    background: rgba(212,120,38,.12);
    border-left: 3px solid var(--accent);
    padding: 8px 12px; font-size: 13px;
    border-radius: 0 8px 8px 0; margin-top: 10px;
    color: var(--ink);
  }
  /* 错误/危险框（红色左边框） */
  .danger-box {
    background: rgba(168,56,56,.1);
    border-left: 3px solid var(--danger);
    padding: 8px 12px; font-size: 13px;
    border-radius: 0 8px 8px 0; margin-top: 10px;
    color: var(--ink);
  }

  /* 代码框（深色底） */
  .code-box {
    background: var(--ink); color: #f1e9d4;
    padding: 10px 14px; border-radius: 8px;
    font-family: monospace; font-size: 13px;
    word-break: break-all; margin: 8px 0;
  }

  /* 向下箭头 */
  .arrow { text-align: center; font-size: 20px; color: var(--ink-2); margin: 8px 0; }

  /* 阶段标题（带色块标签） */
  .phase-title {
    font-size: 18px; font-weight: 800; color: var(--accent);
    margin: 24px 0 12px; padding-bottom: 6px;
    border-bottom: 2px solid var(--border-d);
    display: flex; align-items: center; gap: 8px;
  }
  .phase-title .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
  }

  /* 页脚 */
  .footer {
    text-align: center; margin-top: 24px; padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--ink-2); font-style: italic;
  }

  /* 手机端优化 */
  @media (max-width: 480px) {
    .step { padding: 16px 14px; }
    .step::before { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============================================================
       页头：改标题、副标题、小标签
       ============================================================ -->
  <div class="header">
    <div class="kicker">GUIDE · 指南</div>
    <h1>你的标题写在这里</h1>
    <div class="sub">副标题写在这里</div>
  </div>

  <!-- ============================================================
       阶段一
       ============================================================ -->
  <div class="phase-title">
    <span class="badge" style="background:var(--accent);color:#fff;">标签1</span>
    阶段标题写在这里
  </div>

  <!-- ↓↓↓ 步骤卡片模板：复制这一整块改内容即可 ↓↓↓ -->
  <div class="step">
    <span class="device-badge pc">电脑操作</span>
    <div class="step-num">第 1 步</div>
    <h3>步骤标题</h3>
    <p>这里写说明文字。</p>
    <ol>
      <li>第一步做什么</li>
      <li>第二步做什么</li>
      <li>第三步做什么</li>
    </ol>
    <!-- 提示框（可选） -->
    <div class="tip">小贴士写在这里。</div>
    <!-- 警告框（可选） -->
    <div class="warn">注意事项写在这里。</div>
    <!-- 代码/网址框（可选） -->
    <div class="code-box">https://网址或代码写在这里</div>
  </div>
  <!-- ↑↑↑ 步骤卡片结束 ↑↑↑ -->

  <!-- 箭头分隔 -->
  <div class="arrow">↓</div>

  <!-- 再加一个步骤就复制上面的 .step 块 -->
  <div class="step">
    <span class="device-badge phone">手机操作</span>
    <div class="step-num">第 2 步</div>
    <h3>另一个步骤</h3>
    <p>说明文字。</p>
  </div>

  <!-- ============================================================
       常见问题区（可选）
       ============================================================ -->
  <div class="phase-title">
    <span class="badge" style="background:var(--ink);color:#f1e9d4;">补充</span>
    常见问题
  </div>

  <div class="step">
    <h3>Q：问题写在这里？</h3>
    <p>回答写在这里。</p>
    <h3 style="margin-top:14px;">Q：另一个问题？</h3>
    <p>回答写在这里。</p>
  </div>

  <!-- ============================================================
       页脚
       ============================================================ -->
  <div class="footer">
    你的署名 · 2026
  </div>

</div>
</body>
</html>
